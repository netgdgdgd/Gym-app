<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GYMLOG APP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  /* PALETA — LIGHT */
  --paper:#efede3;        /* fondo claro */
  --ink:#1f221f;          /* texto en claro */
  --accent-green:#708d50; /* verde militar */
  --soft-gray:#b0b1ab;    /* gris suave */
  --chip-bg:#f4f2ec;

  /* PALETA — DARK (Asphalt / Acetato) */
  --asphalt:#302f2c;      /* fondo oscuro (asphalt) */
  --asphalt-ink:#ffffff;  /* texto en oscuro -> BLANCO */
  --asphalt-muted:#d9ddd7;
  --asphalt-2:#262621;    /* opción más profunda */
  --border-light:#e6e2d8;
  --border-dark:#3a3935;

  --shadow: 0 10px 30px rgba(0,0,0,.18);
}

/* LIGHT */
html[data-theme="light"] body{ background:var(--paper); color:var(--ink); }
html[data-theme="light"] header{ background:#ffffffc7; backdrop-filter:saturate(140%) blur(8px); border-bottom:1px solid var(--border-light); }
html[data-theme="light"] .card{ background:#fff; border:1px solid var(--border-light); box-shadow:var(--shadow); }
html[data-theme="light"] .btn{ background:var(--accent-green); color:#fff; border:1px solid #5d7845; }
html[data-theme="light"] .btn.secondary{ background:#fff; color:var(--ink); border:1px solid var(--border-light); }
html[data-theme="light"] .input{ background:#fff; color:var(--ink); border:1px solid var(--border-light); }
html[data-theme="light"] .muted{ color:#5b615c; }
html[data-theme="light"] .chip{ background:var(--chip-bg); color:#3c413b; border:1px solid var(--border-light); }

/* DARK */
html[data-theme="dark"] body{ background:linear-gradient(180deg,var(--asphalt), var(--asphalt-2)); color:var(--asphalt-ink); }
html[data-theme="dark"] header{ background:#2c2b28cc; backdrop-filter:saturate(140%) blur(8px); border-bottom:1px solid var(--border-dark); color:var(--asphalt-ink); }
html[data-theme="dark"] .card{ background:#262622; color:var(--asphalt-ink); border:1px solid var(--border-dark); box-shadow:0 12px 28px rgba(0,0,0,.35); }
html[data-theme="dark"] .btn{ background:var(--accent-green); color:#ffffff; border:1px solid #5d7845; }
html[data-theme="dark"] .btn.secondary{ background:#2a2a26; color:#ffffff; border:1px solid var(--border-dark); }
html[data-theme="dark"] .input{ background:#2a2a26; color:#ffffff; border:1px solid var(--border-dark); }
html[data-theme="dark"] .muted{ color:var(--asphalt-muted); }
html[data-theme="dark"] .chip{ background:#2f302c; color:#e4e7df; border:1px solid var(--border-dark); }

*{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
body{ margin:0; font-family:Inter,system-ui,Segoe UI,Roboto,Arial,sans-serif; }
header{ position:sticky; top:0; z-index:5; display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 14px; }
.brand{ display:flex; align-items:center; gap:10px; }
.logo-wrap{ display:flex; align-items:center; gap:10px; }
.logo{ width:36px; height:36px; border-radius:10px }
.wordmark{ font-weight:800; letter-spacing:.2px }
.badge{ font-size:12px; padding:2px 8px; border-radius:999px; border:1px solid currentColor; opacity:.7 }
.toolbar{ display:flex; align-items:center; gap:8px; flex-wrap:wrap }
.container{ max-width:1080px; margin:0 auto; padding:16px; }
.grid{ display:grid; grid-template-columns:1fr; gap:16px }
@media(min-width:1000px){ .grid{ grid-template-columns:460px 1fr; } }
h2{ margin:6px 0 4px 0; }
small.muted{ opacity:.8 }
.card{ border-radius:18px; padding:14px; }
.row{ display:grid; grid-template-columns:1fr 1fr; gap:10px }
@media(max-width:720px){ .row{ grid-template-columns:1fr } }
.field{ display:flex; flex-direction:column; gap:6px }
label{ font-size:12px; opacity:.9 }
.input, select, textarea{ width:100%; padding:10px 12px; border-radius:12px; border:1px solid; background:transparent; outline:none }
textarea{ resize:vertical; min-height:72px }
.btn{ padding:10px 12px; border-radius:12px; font-weight:700; cursor:pointer; transition: transform .06s ease, box-shadow .2s ease; }
.btn:active{ transform: scale(.98); }
.btn.ghost{ background:transparent; border:1px dashed currentColor; }
.actions{ display:flex; gap:8px; flex-wrap:wrap }
.kpis{ display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px }
@media(max-width:900px){ .kpis{ grid-template-columns:repeat(2,minmax(0,1fr)); } }
.hr{ height:1px; opacity:.25; background:currentColor; margin:10px 0 }
table{ width:100%; border-collapse:separate; border-spacing:0 8px }
th,td{ text-align:left; padding:8px 10px }
thead th{ font-size:12px; opacity:.85 }
tbody tr td{ border-top:1px solid currentColor; border-bottom:1px solid currentColor; opacity:.95 }
tbody tr td:first-child{ border-left:1px solid currentColor; border-top-left-radius:10px; border-bottom-left-radius:10px }
tbody tr td:last-child{ border-right:1px solid currentColor; border-top-right-radius:10px; border-bottom-right-radius:10px }
.right{ text-align:right }
.chips{ display:flex; gap:6px; flex-wrap:wrap }
.chip{ display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:999px; font-size:12px }
.chip.ok{ color:#9be5a8 } .chip.warn{ color:#ffd17a } .chip.bad{ color:#ff9b9b }
.tap{ position:relative; overflow:hidden }
.tap:active::after{ content:""; position:absolute; inset:0; background:rgba(255,255,255,.08); animation:ripple .4s ease; }
@keyframes ripple{ from{ opacity:.7 } to{ opacity:0 } }
.stepper{ display:flex; gap:8px; flex-wrap:wrap }
.step{ padding:6px 10px; border-radius:999px; font-size:12px; border:1px solid currentColor; opacity:.8 }
.step.active{ opacity:1; background:rgba(0,0,0,.06) }
.toast{ position:fixed; left:50%; bottom:16px; transform:translateX(-50%) translateY(30px); opacity:0; transition:all .3s ease; z-index:10; padding:10px 14px; border-radius:12px; font-weight:600; }
.toast.show{ opacity:1; transform:translateX(-50%) translateY(0) }
html[data-theme="light"] .toast{ background:#fff; border:1px solid var(--border-light); color:#1f2a22; }
html[data-theme="dark"] .toast{ background:#272722; border:1px solid var(--border-dark); color:#ffffff; }
.card.accent{ outline:2px solid rgba(112,141,80,.35); outline-offset:0; }

/* Calendar */
.calendar{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-top:8px }
.cal-head{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px; font-size:12px; opacity:.8 }
.cal-cell{ border:1px solid currentColor; border-radius:10px; padding:8px; min-height:54px; display:flex; flex-direction:column; gap:6px }
.cal-cell .d{ font-weight:700 }
.cal-cell.has .dot{ width:8px; height:8px; border-radius:50%; background:var(--accent-green) }

/* === UI CLEANUP: Dark mode white text everywhere === */
html[data-theme="dark"], html[data-theme="dark"] body,
html[data-theme="dark"] header, html[data-theme="dark"] .card,
html[data-theme="dark"] .btn, html[data-theme="dark"] .input,
html[data-theme="dark"] select, html[data-theme="dark"] textarea,
html[data-theme="dark"] table, html[data-theme="dark"] th, html[data-theme="dark"] td,
html[data-theme="dark"] .step, html[data-theme="dark"] .step.active,
html[data-theme="dark"] .wordmark, html[data-theme="dark"] .muted {
  color: #ffffff !important;
}
html[data-theme="dark"] .input::placeholder,
html[data-theme="dark"] textarea::placeholder { color: rgba(255,255,255,.7) !important; }
html[data-theme="dark"] .hr { background: rgba(255,255,255,.25) !important; }


/* ——— PARCHE LEGIBILIDAD TABLAS (modo oscuro) ——— */
html[data-theme="dark"] thead th { color:#fff !important; opacity:1 !important; }
html[data-theme="dark"] tbody tr td { color:#fff !important; opacity:1 !important; }
html[data-theme="dark"] tbody tr td .muted { color:rgba(255,255,255,.8) !important; }
html[data-theme="dark"] td.right { color:#fff !important; }
html[data-theme="dark"] tbody tr td { border-color: rgba(255,255,255,.25) !important; }

</style>

<body>
<header>
  <div class="brand">
    <div class="logo-wrap">
      <!-- Inline SVG logo "gl" estilo mostrado -->
      <svg class="logo" viewBox="0 0 128 128" aria-hidden="true">
        <rect rx="16" width="128" height="128" fill="currentColor" opacity=".07"></rect>
        <path d="M44 92c-12 0-22-10-22-22V58c0-12 10-22 22-22h12c2.2 0 4 1.8 4 4v12c0 2.2-1.8 4-4 4H48a6 6 0 0 0-6 6v8a6 6 0 0 0 6 6h8c2.2 0 4 1.8 4 4v8c0 2.2-1.8 4-4 4H44Z" fill="currentColor"/>
        <path d="M84 32c6.6 0 12 5.4 12 12v40c0 6.6-5.4 12-12 12s-12-5.4-12-12V44c0-6.6 5.4-12 12-12Z" fill="currentColor"/>
      </svg>
      <div>
        <div class="wordmark">gymlog</div>
        <small class="muted">Track your strength. Log your progress.</small>
      </div>
    </div>
    
  </div>

  <div class="toolbar">
    <button id="themeBtn" class="btn secondary tap" title="Cambiar tema">Tema</button>
    <label class="btn secondary tap" style="display:inline-flex;align-items:center;gap:8px">
      <input id="demoToggle" type="checkbox"> Modo prueba
    </label>
    <button id="exportBtn" class="btn secondary tap" title="Exportar JSON">Exportar</button>
    <input id="importInput" type="file" accept="application/json" hidden>
    <button id="importBtn" class="btn secondary tap" title="Importar JSON">Importar</button>

    <!-- Logo uploader (opcional) -->
    </div>
</header>

<main class="container grid">
  <!-- Sesión guiada -->
  <section class="card accent">
    <h2>Sesión guiada</h2>
    <small class="muted">Rutina cerrada · Biomecánica</small>
    <div class="row" style="margin-top:8px">
      <div class="field"><label>Selector de día (pruebas)</label><select id="planSelect" class="input"></select></div>
      <div class="field"><label>Fecha a registrar</label><input id="dateInput" type="date" class="input"></div>
    </div>

    <div class="hr"></div>
    <div class="stepper" id="stepper"></div>
    <div class="hr"></div>

    <div class="row">
      <div class="field"><label>Ejercicio</label><select id="exerciseSelect" class="input"></select></div>
      <div class="field"><label>Unidad</label><select id="unitSelect" class="input"><option value="kg">kg</option><option value="lb">lb</option></select></div>
      <div class="field"><label>Serie</label><select id="setSelect" class="input"></select></div>
      <div class="field"><label>Rango objetivo</label><input id="repRange" class="input" readonly></div>
    </div>

    <div class="row" style="margin-top:8px">
      <div class="field"><label>Peso</label><input id="weightInput" type="number" step="0.5" min="0" class="input" placeholder="0.0"></div>
      <div class="field"><label>Reps</label><input id="repsInput" type="number" step="1" min="0" class="input" placeholder="0"></div>
      <div class="field"><label>RIR</label><input id="rirInput" type="number" step="0.5" min="0" max="5" class="input" placeholder="0"></div>
      <div class="field"><label>Descanso (s)</label><input id="restInput" type="number" step="5" min="30" class="input" value="90"></div>
    </div>

    <div class="field" style="margin-top:8px">
      <label>Notas (opcional)</label>
      <textarea id="notesInput" class="input" placeholder="¿Cómo te sentiste? ¿Algún ajuste?"></textarea>
    </div>

    <div class="actions" style="margin-top:8px">
      <button id="saveSetBtn" class="btn tap">Guardar set</button>
      <button id="nextSetBtn" class="btn secondary tap">Siguiente set</button>
      <button id="nextExerciseBtn" class="btn secondary tap">Siguiente ejercicio</button>
      <button id="finishBtn" class="btn ghost tap">Cerrar sesión</button>
    </div>
    <div class="hr"></div>
    <div class="chips" id="aiHints"></div>
  </section>

  <!-- Progreso -->
  <section class="card">
    <h2>Progreso</h2>
    <div class="kpis">
      <div class="card"><small class="muted">Última sesión</small><h3 id="kLast">—</h3></div>
      <div class="card"><small class="muted">Tendencia</small><h3 id="kTrend">—</h3></div>
      <div class="card"><small class="muted">Peso máx.</small><h3 id="kMaxW">—</h3></div>
      <div class="card"><small class="muted">Reps máx.</small><h3 id="kMaxR">—</h3></div>
    </div>

    <div class="hr"></div>
    <table>
      <thead><tr><th>Fecha</th><th>Sets (peso×reps · RIR)</th><th>Notas</th><th class="right">Top peso</th><th class="right">Top reps</th><th>Estatus</th></tr></thead>
      <tbody id="tableBody"></tbody>
    </table>

    <div class="hr"></div>
    <div class="card">
      <small class="muted">Evolución de peso</small>
      <canvas id="weightChart" height="170"></canvas>
    </div>
    <div class="card" style="margin-top:12px">
      <small class="muted">Evolución de repeticiones</small>
      <canvas id="repsChart" height="170"></canvas>
    </div>

    <div class="hr"></div>
    <h3 style="margin:0 0 4px 0">Calendario</h3>
    <div class="row">
      <div class="field"><label>Mes</label><input type="month" id="monthPicker" class="input"></div>
      <div class="actions" style="align-items:end"><button id="refreshCalBtn" class="btn secondary tap">Actualizar</button></div>
    </div>
    <div class="cal-head" id="calHead"></div>
    <div class="calendar" id="calendar"></div>
  </section>
</main>

<div class="toast" id="toast"></div>

<script>
const storeKey = "gymlog.promax.v522.biomec";
const $ = (q)=>document.querySelector(q);
const $$ = (q)=>Array.from(document.querySelectorAll(q));
let DEMO=false;

/* ---------- PALETA cargada ---------- */
/* Rutina (igual a la versión biomecánica previa) */
const routine = {
  order:["Torso A","Pierna A","Torso B","Pierna B","Torso C"],
  blocks:{
    "Torso A":[
      { name:"Press inclinado Smith", sets:2, reps:"6–8", rir:"1–2" },
      { name:"Remo pecho apoyado", sets:2, reps:"6–8", rir:"1–2" },
      { name:"Press convergente decl.", sets:2, reps:"8–10", rir:"1" },
      { name:"Jalón uni polea", sets:2, reps:"8–10", rir:"1" },
      { name:"Curl predicador polea", sets:2, reps:"10–12", rir:"0–1" },
      { name:"Curl polea alta uni", sets:2, reps:"10–12", rir:"0–1" },
      { name:"Pressdown inclinado", sets:2, reps:"10–12", rir:"0–1" },
      { name:"Press francés cable", sets:2, reps:"10–12", rir:"0–1" },
      { name:"Elevaciones laterales", sets:2, reps:"12–15", rir:"0–1" },
    ],
    "Pierna A":[
      { name:"Sentadilla péndulo", sets:2, reps:"8–10", rir:"1–2" },
      { name:"Extensión cuádriceps", sets:2, reps:"12–15", rir:"0–1" },
      { name:"Back extension", sets:2, reps:"12–15", rir:"0–1" },
      { name:"Aducción máquina", sets:2, reps:"12–15", rir:"0–1" },
      { name:"Pantorrilla de pie", sets:2, reps:"12–15", rir:"0" },
      { name:"Crunch cable", sets:3, reps:"10–12", rir:"0–1" },
      { name:"Leg raise lastre", sets:2, reps:"12–15", rir:"0–1" },
    ],
    "Torso B":[
      { name:"Press inclinado DB", sets:2, reps:"8–10", rir:"1–2" },
      { name:"Cruce polea baja", sets:2, reps:"12–15", rir:"0–1" },
      { name:"Jalón supino polea", sets:2, reps:"8–10", rir:"1–2" },
      { name:"Pull-over máquina", sets:2, reps:"12–15", rir:"1" },
      { name:"Remo barra T", sets:2, reps:"8–10", rir:"1" },
      { name:"Extensión tríceps uni", sets:2, reps:"10–12", rir:"0–1" },
      { name:"Curl martillo cuerda", sets:2, reps:"10–12", rir:"0–1" },
      { name:"Curl spider banco", sets:2, reps:"10–12", rir:"0–1" },
      { name:"Reverse fly 30°", sets:2, reps:"12–15", rir:"0–1" },
    ],
    "Pierna B":[
      { name:"Peso muerto rumano", sets:2, reps:"8–10", rir:"1–2" },
      { name:"Curl femoral tumbado", sets:2, reps:"10–12", rir:"1" },
      { name:"Hip thrust", sets:2, reps:"10–12", rir:"1" },
      { name:"Prensa pies altos", sets:2, reps:"10–12", rir:"1–2" },
      { name:"Abducción máquina", sets:2, reps:"12–15", rir:"0–1" },
      { name:"Pantorrilla sentado", sets:2, reps:"15–20", rir:"0" },
      { name:"Ab crunch máquina", sets:2, reps:"12–15", rir:"0" },
      { name:"Cable oblique twist", sets:2, reps:"15–20", rir:"0–1" },
    ],
    "Torso C":[
      { name:"Press vertical guiado", sets:2, reps:"10–12", rir:"1" },
      { name:"Remo inclinado DB", sets:2, reps:"10–12", rir:"1" },
      { name:"Cruce alto polea", sets:2, reps:"12–15", rir:"1" },
      { name:"Jalón neutro", sets:2, reps:"12–15", rir:"1" },
      { name:"Curl banco inclinado", sets:2, reps:"10–12", rir:"0–1" },
      { name:"Curl concentrado", sets:2, reps:"10–12", rir:"0–1" },
      { name:"Fondos asistidos", sets:2, reps:"10–12", rir:"0–1" },
      { name:"Press francés Z", sets:2, reps:"10–12", rir:"0–1" },
      { name:"Elevaciones laterales", sets:2, reps:"12–15", rir:"0–1" },
    ]
  }
};

function todayISO(){ return new Date().toISOString().slice(0,10); }
function loadDB(){ try{ return JSON.parse(localStorage.getItem(storeKey)) || { unit:"kg", exercises:{}, notes:{}, lastDate:null, logo:null }; }catch(_){ return { unit:"kg", exercises:{}, notes:{}, lastDate:null, logo:null }; } }
function saveDB(){ if(!DEMO){ localStorage.setItem(storeKey, JSON.stringify(DB)); } }
let DB = loadDB();

/* ---------- THEME ---------- */
const prefersDark = matchMedia("(prefers-color-scheme: dark)").matches;
if(!localStorage.getItem(storeKey+".theme")){
  document.documentElement.setAttribute("data-theme", prefersDark ? "dark" : "light");
}else{
  document.documentElement.setAttribute("data-theme", localStorage.getItem(storeKey+".theme"));
}
$("#themeBtn").onclick = ()=>{
  const cur = document.documentElement.getAttribute("data-theme");
  const next = (cur==="light")?"dark":"light";
  document.documentElement.setAttribute("data-theme", next);
  localStorage.setItem(storeKey+".theme", next);
  toast("Tema: " + (next==="light"?"Claro (paper)":"Oscuro (asphalt)"));
};
$("#demoToggle").onchange = (e)=>{ DEMO = e.target.checked; toast(DEMO ? "Modo prueba: sin guardar permanente" : "Modo normal: guardado activado"); };

/* removed logo upload block *//* ---------- HELPERS ---------- */
function toast(msg){
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 2000);
}
function setToday(){ $("#dateInput").value = todayISO(); }
function ensureExerciseEntry(exName){
  if(!DB.exercises[exName]) DB.exercises[exName] = { unit:DB.unit||"kg", sessions:[] };
}
function getSession(exName, date){
  ensureExerciseEntry(exName);
  const arr = DB.exercises[exName].sessions;
  let s = arr.find(x=>x.date===date);
  if(!s){ s = { date, unit:DB.unit||"kg", sets:[], note:null }; arr.push(s); arr.sort((a,b)=>a.date.localeCompare(b.date)); }
  return s;
}

/* ---------- BUILD SELECTORS ---------- */
function buildPlanSelector(){
  const sel = $("#planSelect"); sel.innerHTML="";
  routine.order.forEach(n=>{ const o=document.createElement("option"); o.value=n; o.textContent=n; sel.appendChild(o); });
  sel.value = routine.order[0];
}
function hydrateStepper(planName){
  const st = $("#stepper"); st.innerHTML="";
  routine.blocks[planName].forEach((ex,i)=>{
    const b = document.createElement("div");
    b.className = "step" + (i===0?" active":"");
    b.textContent = `${i+1}/${routine.blocks[planName].length} · ${ex.name}`;
    st.appendChild(b);
  });
}
function buildExerciseSelect(planName){
  const sel = $("#exerciseSelect");
  sel.innerHTML="";
  routine.blocks[planName].forEach(ex=>{ const o=document.createElement("option"); o.value=ex.name; o.textContent=ex.name; sel.appendChild(o); });
  updateSetSelect();
}
function getCurrentSpec(){
  const plan = $("#planSelect").value;
  const ex = $("#exerciseSelect").value;
  return routine.blocks[plan].find(x=>x.name===ex) || null;
}
function updateSetSelect(){
  const spec = getCurrentSpec();
  const sel = $("#setSelect"); sel.innerHTML="";
  if(!spec) return;
  for(let i=1;i<=spec.sets;i++){ const o=document.createElement("option"); o.value=i; o.textContent=`Set ${i}`; sel.appendChild(o); }
  $("#repRange").value = `${spec.reps} · RIR ${spec.rir}`;
  $("#unitSelect").value = DB.unit || "kg";
}

/* ---------- INIT SELECTORS ---------- */
buildPlanSelector(); setToday();
hydrateStepper($("#planSelect").value);
buildExerciseSelect($("#planSelect").value);

$("#planSelect").onchange = ()=>{ hydrateStepper($("#planSelect").value); buildExerciseSelect($("#planSelect").value); renderAIHints(); renderProgress(); };
$("#exerciseSelect").onchange = ()=>{ updateSetSelect(); renderAIHints(); renderProgress(); };
$("#unitSelect").onchange = (e)=>{ DB.unit = e.target.value; saveDB(); };

$("#nextSetBtn").onclick = ()=>{
  const sel = $("#setSelect"); if(!sel.value) return;
  const next = +sel.value + 1; if(next <= sel.options.length) sel.value = String(next); else toast("Sets completados. Siguiente ejercicio.");
};
$("#nextExerciseBtn").onclick = ()=>{
  const plan = $("#planSelect").value, list = routine.blocks[plan];
  const idx = list.findIndex(x=>x.name===$("#exerciseSelect").value);
  const next = Math.min(idx+1, list.length-1);
  $("#exerciseSelect").value = list[next].name; updateSetSelect(); renderAIHints(); renderProgress();
  $$("#stepper .step").forEach((el,i)=> el.classList.toggle("active", i===next) );
};

/* ---------- SAVE ---------- */
$("#saveSetBtn").onclick = ()=>{
  const ex = $("#exerciseSelect").value;
  const unit = $("#unitSelect").value;
  const setNo = +$("#setSelect").value;
  const w = +$("#weightInput").value;
  const r = +$("#repsInput").value;
  const rir = $("#rirInput").value==="" ? null : +$("#rirInput").value;
  const date = $("#dateInput").value || todayISO();
  if(!(ex && setNo && w>0 && r>0)){ toast("Completa peso y reps"); return; }

  ensureExerciseEntry(ex);
  const s = getSession(ex, date); s.unit = unit;
  const idx = s.sets.findIndex(x=>x.n===setNo);
  const payload = { n:setNo, w, r, rir };
  if(idx>=0) s.sets[idx]=payload; else s.sets.push(payload);
  s.sets.sort((a,b)=>a.n-b.n);
  DB.exercises[ex].sessions.sort((a,b)=>a.date.localeCompare(b.date));
  if(!DEMO) saveDB();
  toast(DEMO? "Set guardado (prueba)":"Set guardado");
  renderAIHints(); renderProgress();
};
$("#finishBtn").onclick = ()=>{
  const ex = $("#exerciseSelect").value;
  const date = $("#dateInput").value || todayISO();
  const note = $("#notesInput").value.trim();
  if(ex){
    const s = getSession(ex, date);
    if(note) s.note = note;
    DB.lastDate = date;
    if(!DEMO) saveDB();
  }
  $("#notesInput").value="";
  toast(DEMO? "Sesión cerrada (prueba)":"Sesión cerrada");
  renderProgress();
};

/* ---------- EXPORT / IMPORT ---------- */
$("#exportBtn").onclick = ()=>{
  const blob = new Blob([JSON.stringify(DB,null,2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href=url; a.download="gymlog_promax_v522_biomec_export.json"; a.click();
  URL.revokeObjectURL(url);
};
$("#importBtn").onclick = ()=>$("#importInput").click();
$("#importInput").onchange = (e)=>{
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{
    try{
      const data = JSON.parse(r.result);
      if(!data || !data.exercises) throw new Error("Formato no válido");
      DB = data; if(!DEMO) saveDB();
      toast("Datos importados");
      renderProgress(); renderCalendar(); applyLogo();
    }catch(err){ alert("Error importando: "+err.message); }
  };
  r.readAsText(f);
};

/* ---------- IA (rule-based) ---------- */
function summarize(exName){
  const E = DB.exercises[exName]; if(!E) return [];
  return E.sessions.map(s=>{
    const topW = s.sets.reduce((m,a)=>Math.max(m,a.w),0);
    const repsAvg = s.sets.length? s.sets.reduce((sum,a)=>sum+a.r,0)/s.sets.length : 0;
    return { date:s.date, topW, repsAvg:+repsAvg.toFixed(1) };
  });
}
function getAIHints(exName){
  const arr = summarize(exName);
  if(arr.length<2) return [{type:"info", text:"Aún no hay suficiente historial para recomendaciones."}];
  const last3 = arr.slice(-3);
  const w = last3.map(x=>x.topW);
  const r = last3.map(x=>x.repsAvg);
  let hints=[];
  if(w.length>=2){
    const dw = w[w.length-1] - w[w.length-2];
    if(dw>0.5) hints.push({type:"ok", text:"↑ Subiste peso vs. la sesión anterior."});
    if(dw<-0.5) hints.push({type:"bad", text:"↓ Bajó el peso. Revisa fatiga/recuperación."});
  }
  if(r.length>=2){
    const dr = r[r.length-1] - r[r.length-2];
    if(dr>0.4) hints.push({type:"ok", text:"↑ Más reps a peso similar. Considera subir carga."});
    if(dr<-0.4) hints.push({type:"warn", text:"↓ Menos reps. Mantén o baja peso para cumplir rango."});
  }
  if(last3.length===3){
    const spanW = Math.max(...w)-Math.min(...w);
    const spanR = Math.max(...r)-Math.min(...r);
    if(spanW<1 && spanR<1){
      hints.push({type:"warn", text:"→ Meseta en 3 sesiones. +2.5–5% o variar rango."});
    }
  }
  return hints.length? hints : [{type:"info", text:"Sin alertas. Mantén el plan."}];
}
function renderAIHints(){
  const ex = $("#exerciseSelect").value;
  const wrap = $("#aiHints"); wrap.innerHTML="";
  getAIHints(ex).forEach(h=>{
    const s = document.createElement("span");
    s.className = "chip " + (h.type==="ok"?"ok":h.type==="bad"?"bad":h.type==="warn"?"warn":"");
    s.textContent = h.text;
    wrap.appendChild(s);
  });
}

/* ---------- TABLA + GRÁFICAS ---------- */
let weightChart=null, repsChart=null;
function renderProgress(){
  const ex = $("#exerciseSelect").value;
  const body = $("#tableBody"); body.innerHTML="";
  if(!ex || !DB.exercises[ex] || DB.exercises[ex].sessions.length===0){ destroyCharts(); kpis(null); return; }

  const S = DB.exercises[ex].sessions.slice().sort((a,b)=>a.date.localeCompare(b.date));
  let maxW=0, maxR=0;
  const labels=[], wSeries=[], rSeries=[];
  for(let i=0;i<S.length;i++){
    const s=S[i];
    const setsTxt = s.sets.map(a=>`${a.w}${s.unit}×${a.r}${a.rir!=null?` · RIR ${a.rir}`:""}`).join(", ");
    const topW = s.sets.reduce((m,a)=>Math.max(m,a.w), 0);
    const topR = s.sets.reduce((m,a)=>Math.max(m,a.r), 0);
    maxW = Math.max(maxW, topW);
    maxR = Math.max(maxR, topR);
    labels.push(s.date);
    wSeries.push(topW);
    rSeries.push(topR);

    const prev = i>0 ? S[i-1] : null;
    let status = "—";
    if(prev){
      const pW = prev.sets.reduce((m,a)=>Math.max(m,a.w), 0);
      const pR = prev.sets.reduce((m,a)=>Math.max(m,a.r), 0);
      status = (topW>pW || topR>pR) ? "↑ Progreso" : (topW<pW || topR<pR) ? "↓ Retroceso" : "→ Igual";
    }
    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${s.date}</td><td>${setsTxt}</td><td>${s.note? s.note.replace(/</g,"&lt;") : ""}</td>
                    <td class="right">${topW} ${s.unit}</td><td class="right">${topR}</td><td>${status}</td>`;
    body.appendChild(tr);
  }
  kpis({ last:S[S.length-1].date, maxW, maxR, trend: body.lastChild? body.lastChild.children[5].textContent : "—" });
  drawCharts(labels, wSeries, rSeries);
  renderCalendar();
}
function kpis(d){
  $("#kLast").textContent = d? d.last : "—";
  $("#kTrend").textContent = d? d.trend : "—";
  $("#kMaxW").textContent = d? d.maxW : "—";
  $("#kMaxR").textContent = d? d.maxR : "—";
}
function destroyCharts(){ if(weightChart){ weightChart.destroy(); weightChart=null; } if(repsChart){ repsChart.destroy(); repsChart=null; } }
function drawCharts(labels, w, r){
  destroyCharts();
  const base={ type:'line', options:{
    responsive:true, interaction:{ mode:'index', intersect:false },
    plugins:{ legend:{ display:false }, tooltip:{ enabled:true } },
    scales:{ x:{ ticks:{ color:'inherit' }, grid:{ color:'rgba(127,127,127,.15)'} },
             y:{ ticks:{ color:'inherit' }, grid:{ color:'rgba(127,127,127,.15)'}, beginAtZero:true } },
    elements:{ point:{ radius:3 } }
  }};
  weightChart = new Chart($("#weightChart").getContext('2d'),{ ...base, data:{ labels, datasets:[{ label:'Peso', data:w }] } });
  repsChart = new Chart($("#repsChart").getContext('2d'),{ ...base, data:{ labels, datasets:[{ label:'Reps', data:r }] } });
}

/* ---------- CALENDARIO ---------- */
function monthStr(d){ return d.toISOString().slice(0,7); }
function firstOfMonth(ym){ const [y,m]=ym.split("-").map(Number); return new Date(y,m-1,1); }
function daysInMonth(ym){ const [y,m]=ym.split("-").map(Number); return new Date(y,m,0).getDate(); }
function renderCalendar(){
  const picker = $("#monthPicker"); if(!picker.value){ picker.value = monthStr(new Date()); }
  const ym = picker.value;
  const head = $("#calHead"); head.innerHTML="";
  ["L","M","X","J","V","S","D"].forEach(n=>{ const div=document.createElement("div"); div.textContent=n; head.appendChild(div); });
  const start = firstOfMonth(ym); const startIdx = (start.getDay()+6)%7; const total = daysInMonth(ym);
  const grid = $("#calendar"); grid.innerHTML="";
  for(let i=0;i<startIdx;i++){ const ph = document.createElement("div"); grid.appendChild(ph); }
  for(let d=1; d<=total; d++){
    const cell = document.createElement("div"); cell.className="cal-cell";
    const ds = `${ym}-${String(d).padStart(2,"0")}`;
    const hd = document.createElement("div"); hd.className="d"; hd.textContent=d; cell.appendChild(hd);
    let has=false; Object.values(DB.exercises).forEach(E=>{ if(E.sessions.some(s=>s.date===ds && s.sets.length>0)) has=true; });
    if(has){ const dot=document.createElement("div"); dot.className="dot"; cell.classList.add("has"); cell.appendChild(dot); }
    cell.onclick=()=>{ $("#dateInput").value=ds; toast("Fecha seleccionada: "+ds); };
    grid.appendChild(cell);
  }
}
$("#refreshCalBtn").onclick = ()=>renderCalendar();
$("#monthPicker").onchange = ()=>renderCalendar();

/* ---------- INIT ---------- */
(function init(){
  renderProgress();
  renderAIHints();
  renderCalendar();
})();
</script>
